name: Remote AI ML Job Bot

on:

  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"
    # 00:00 Asia/Kolkata daily report (18:30 UTC).
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: remote-job-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:

  check-jobs:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -v

      - name: Create sent_jobs.json
        run: |
          if [ ! -f sent_jobs.json ]; then
            echo "[]" > sent_jobs.json
          fi

      - name: Run job bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            python main.py --daily-report
          else
            python main.py
          fi

      - name: Save sent jobs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_jobs.json career_intelligence.db

          git diff --cached --quiet || git commit -m "Update sent jobs"

          git push